<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I'm Attending — Common Ground 2026</title>
  <meta name="description" content="I'm attending Common Ground 2026! Get your pass and join me.">
  <meta name="theme-color" content="#061A40">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <style>
    .badge-wrapper {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: radial-gradient(ellipse at 25% 0%, rgba(0, 86, 255, 0.08) 0%, transparent 50%), 
                  radial-gradient(ellipse at 75% 100%, rgba(33, 163, 75, 0.05) 0%, transparent 50%), 
                  linear-gradient(160deg, #EEF2FF 0%, #F0F4FF 40%, #F5F8FF 70%, #FFFFFF 100%);
      background-size: 200% 200%;
      animation: heroGlow 20s ease infinite;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .badge-container {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      box-shadow: 0 12px 48px rgba(0, 18, 68, 0.06), 0 1px 3px rgba(0, 18, 68, 0.02);
      padding: 3rem;
      max-width: 600px;
      width: 100%;
      z-index: 2;
      animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge-image {
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 18, 68, 0.15);
      margin: 0 auto 2.5rem auto;
      display: block;
      transition: transform 0.3s ease;
    }
    
    .badge-image:hover {
      transform: scale(1.02);
    }

    .badge-title {
      font-family: var(--font-display);
      font-size: 2.5rem;
      color: var(--primary);
      margin-bottom: 0.5rem;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .badge-subtitle {
      font-family: var(--font-body);
      font-size: 1.125rem;
      color: var(--text-2);
      margin-bottom: 2.5rem;
    }

    .action-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--primary);
      color: #fff;
      padding: 1rem 2rem;
      border-radius: 12px;
      font-family: var(--font-body);
      font-weight: 500;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(0, 18, 68, 0.15);
    }

    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 18, 68, 0.25);
      background: var(--accent);
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: #fff;
      color: var(--primary);
      padding: 1rem 2rem;
      border-radius: 12px;
      font-family: var(--font-body);
      font-weight: 500;
      text-decoration: none;
      transition: all 0.3s ease;
      border: 1px solid rgba(0, 18, 68, 0.1);
    }

    .btn-home:hover {
      background: var(--surface);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 18, 68, 0.08);
    }

    .logo-header {
      margin-bottom: 2rem;
    }
    
    .logo-header img {
      height: 48px;
      mix-blend-mode: multiply;
    }

  </style>
</head>

<body>
  <main class="badge-wrapper">
    <!-- Subtle watermark background -->
    <div class="watermark" style="opacity: 0.02; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(85vw, 700px); height: min(85vw, 700px); pointer-events: none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.3" stroke-linecap="round" stroke-linejoin="round" width="100%" height="100%">
        <circle cx="9" cy="12" r="6"></circle>
        <circle cx="15" cy="12" r="6"></circle>
      </svg>
    </div>

    <div class="badge-container">
      <div class="logo-header">
        <a href="index.html">
          <img src="./logo.webp" alt="Common Ground 2026">
        </a>
      </div>
      
      <h1 class="badge-title">I'm Attending!</h1>
      <p class="badge-subtitle">Download your badge and share it with your network.</p>

      <img src="./im-attending.png" alt="I'm Attending Common Ground 2026" class="badge-image">

      <div class="action-buttons">
        <a href="./im-attending.png" download="CommonGround2026_Attending.png" class="btn-download">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Download Badge
        </a>
        <a href="index.html" class="btn-home">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          Go to Website
        </a>
      </div>
    </div>
  </main>
</body>

</html>
